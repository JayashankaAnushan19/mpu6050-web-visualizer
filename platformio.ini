; PlatformIO build config. The sketch stays in the Arduino IDE layout
; (firmware/mpu6050_stream/mpu6050_stream.ino); PlatformIO is simply pointed at it,
; so both toolchains build the same single source file.
;
;   pio run -t upload        build and flash
;   pio device monitor       open the serial monitor at 115200

[platformio]
src_dir = firmware/mpu6050_stream

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
