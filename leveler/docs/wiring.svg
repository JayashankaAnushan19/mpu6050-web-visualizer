<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Wiring: Arduino Uno, GY-521 (MPU6050) and five LEDs</title>
  <rect width="800" height="500" fill="#0f1419"/>
  <text x="400" y="34" fill="#e6edf3" font-size="20" font-weight="600" text-anchor="middle">Digital Leveler: Uno + GY-521 + 5 LEDs</text>

  <!-- Arduino Uno -->
  <rect x="40" y="60" width="300" height="360" rx="14" fill="#00979d"/>
  <text x="70" y="100" fill="#ffffff" font-size="22" font-weight="700">ARDUINO</text>
  <text x="70" y="124" fill="#d9f5f5" font-size="16">UNO R3</text>
  <rect x="60" y="360" width="70" height="44" rx="4" fill="#9aa5ad"/>
  <text x="95" y="387" fill="#1b1f23" font-size="12" text-anchor="middle">USB</text>

  <!-- GY-521 -->
  <rect x="540" y="78" width="210" height="130" rx="10" fill="#1f4e9c"/>
  <text x="736" y="112" fill="#ffffff" font-size="18" font-weight="700" text-anchor="end">GY-521</text>
  <text x="736" y="134" fill="#c9d8f5" font-size="13" text-anchor="end">MPU6050</text>
  <rect x="690" y="148" width="40" height="40" fill="#111"/>

  <!-- Sensor wires -->
  <g stroke-width="5" stroke-linecap="round">
    <line x1="340" y1="110" x2="540" y2="110" stroke="#e03131"/>
    <line x1="340" y1="135" x2="540" y2="135" stroke="#868e96"/>
    <line x1="340" y1="160" x2="540" y2="160" stroke="#fcc419"/>
    <line x1="340" y1="185" x2="540" y2="185" stroke="#40c057"/>
  </g>
  <g fill="#ffffff" font-size="14">
    <text x="554" y="115">VCC</text><text x="554" y="140">GND</text>
    <text x="554" y="165">SCL</text><text x="554" y="190">SDA</text>
  </g>

  <!-- LED wires: pin -> 220 ohm -> LED anode, cathode -> GND rail -->
  <g stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" fill="none">
    <line x1="340" y1="250" x2="420" y2="250"/><line x1="470" y1="250" x2="570" y2="250"/>
    <line x1="340" y1="285" x2="420" y2="285"/><line x1="470" y1="285" x2="570" y2="285"/>
    <line x1="340" y1="320" x2="420" y2="320"/><line x1="470" y1="320" x2="570" y2="320"/>
    <line x1="340" y1="355" x2="420" y2="355"/><line x1="470" y1="355" x2="570" y2="355"/>
    <line x1="340" y1="390" x2="420" y2="390"/><line x1="470" y1="390" x2="570" y2="390"/>
    <line x1="598" y1="250" x2="660" y2="250"/><line x1="598" y1="285" x2="660" y2="285"/>
    <line x1="598" y1="320" x2="660" y2="320"/><line x1="598" y1="355" x2="660" y2="355"/>
    <line x1="598" y1="390" x2="660" y2="390"/>
  </g>
  <line x1="660" y1="240" x2="660" y2="440" stroke="#868e96" stroke-width="5" stroke-linecap="round"/>
  <text x="672" y="444" fill="#ced4da" font-size="13">to Uno GND</text>

  <!-- Resistors -->
  <g fill="#d6b588" stroke="#7a5c33" stroke-width="1.5">
    <rect x="420" y="243" width="50" height="14" rx="5"/><rect x="420" y="278" width="50" height="14" rx="5"/>
    <rect x="420" y="313" width="50" height="14" rx="5"/><rect x="420" y="348" width="50" height="14" rx="5"/>
    <rect x="420" y="383" width="50" height="14" rx="5"/>
  </g>
  <text x="445" y="232" fill="#d6b588" font-size="12" text-anchor="middle">220 Ω</text>

  <!-- LEDs (left to right on the level) -->
  <g stroke-width="2">
    <circle cx="584" cy="250" r="13" fill="#ff4d4d" stroke="#ffb3b3"/>
    <circle cx="584" cy="285" r="13" fill="#ffc83d" stroke="#ffe7a6"/>
    <circle cx="584" cy="320" r="13" fill="#33e08a" stroke="#a6f5cc"/>
    <circle cx="584" cy="355" r="13" fill="#ffc83d" stroke="#ffe7a6"/>
    <circle cx="584" cy="390" r="13" fill="#ff4d4d" stroke="#ffb3b3"/>
  </g>
  <g fill="#e6edf3" font-size="12">
    <text x="690" y="254">LED1 red (left)</text>
    <text x="690" y="289">LED2 yellow</text>
    <text x="690" y="324">LED3 green (level)</text>
    <text x="690" y="359">LED4 yellow</text>
    <text x="690" y="394">LED5 red (right)</text>
  </g>
  <text x="584" y="226" fill="#adb5bd" font-size="11" text-anchor="middle">+ long leg</text>

  <!-- Uno pins -->
  <g fill="#ffffff" font-size="14" text-anchor="end">
    <text x="326" y="115">5V</text><text x="326" y="140">GND</text>
    <text x="326" y="165">A5 / SCL</text><text x="326" y="190">A4 / SDA</text>
    <text x="326" y="255">D3 ~</text><text x="326" y="290">D5 ~</text>
    <text x="326" y="325">D6 ~</text><text x="326" y="360">D9 ~</text>
    <text x="326" y="395">D10 ~</text>
  </g>
  <g fill="#ffd43b">
    <circle cx="340" cy="110" r="6"/><circle cx="340" cy="135" r="6"/>
    <circle cx="340" cy="160" r="6"/><circle cx="340" cy="185" r="6"/>
    <circle cx="340" cy="250" r="6"/><circle cx="340" cy="285" r="6"/>
    <circle cx="340" cy="320" r="6"/><circle cx="340" cy="355" r="6"/>
    <circle cx="340" cy="390" r="6"/>
    <circle cx="540" cy="110" r="6"/><circle cx="540" cy="135" r="6"/>
    <circle cx="540" cy="160" r="6"/><circle cx="540" cy="185" r="6"/>
  </g>

  <text x="40" y="468" fill="#adb5bd" font-size="13">~ = PWM pin, so the light can fade between LEDs. Row along the sensor's Y axis: use Roll. Along X: use Pitch.</text>
  <text x="40" y="488" fill="#adb5bd" font-size="13">The LED's long leg (anode) goes to the resistor and the short leg to GND. Any resistor from 150 Ω to 1 kΩ works.</text>
</svg>
