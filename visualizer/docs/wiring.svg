<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Wiring: Arduino Uno to GY-521 (MPU6050)</title>
  <rect width="760" height="430" fill="#0f1419"/>

  <text x="380" y="34" fill="#e6edf3" font-size="20" font-weight="600" text-anchor="middle">Arduino Uno  ⇄  GY-521 (MPU6050)</text>

  <!-- Arduino Uno -->
  <rect x="40" y="60" width="300" height="300" rx="14" fill="#00979d"/>
  <text x="70" y="100" fill="#ffffff" font-size="22" font-weight="700">ARDUINO</text>
  <text x="70" y="124" fill="#d9f5f5" font-size="16">UNO R3</text>
  <rect x="60" y="300" width="70" height="44" rx="4" fill="#9aa5ad"/>
  <text x="95" y="327" fill="#1b1f23" font-size="12" text-anchor="middle">USB</text>

  <!-- GY-521 -->
  <rect x="520" y="80" width="200" height="240" rx="10" fill="#1f4e9c"/>
  <text x="690" y="120" fill="#ffffff" font-size="18" font-weight="700" text-anchor="end">GY-521</text>
  <text x="690" y="142" fill="#c9d8f5" font-size="13" text-anchor="end">MPU6050</text>
  <rect x="625" y="175" width="50" height="50" fill="#111"/>
  <!-- axis hint printed on the board -->
  <line x1="640" y1="270" x2="690" y2="270" stroke="#ff6b6b" stroke-width="2"/>
  <text x="696" y="274" fill="#ff6b6b" font-size="12">X</text>
  <line x1="640" y1="270" x2="640" y2="240" stroke="#51cf66" stroke-width="2"/>
  <text x="636" y="236" fill="#51cf66" font-size="12">Y</text>
  <circle cx="640" cy="270" r="4" fill="#4dabf7"/>
  <text x="626" y="290" fill="#4dabf7" font-size="12">Z (up)</text>

  <!-- Wires -->
  <g stroke-width="5" stroke-linecap="round">
    <line x1="340" y1="110" x2="520" y2="110" stroke="#e03131"/>
    <line x1="340" y1="135" x2="520" y2="135" stroke="#868e96"/>
    <line x1="340" y1="160" x2="520" y2="160" stroke="#fcc419"/>
    <line x1="340" y1="185" x2="520" y2="185" stroke="#40c057"/>
    <line x1="340" y1="285" x2="520" y2="285" stroke="#adb5bd" stroke-dasharray="10 8"/>
  </g>

  <!-- Uno pins -->
  <g fill="#ffffff" font-size="14" text-anchor="end">
    <text x="326" y="115">5V</text>
    <text x="326" y="140">GND</text>
    <text x="326" y="165">A5 / SCL</text>
    <text x="326" y="190">A4 / SDA</text>
    <text x="326" y="290">D2</text>
  </g>
  <g fill="#ffd43b">
    <circle cx="340" cy="110" r="6"/><circle cx="340" cy="135" r="6"/>
    <circle cx="340" cy="160" r="6"/><circle cx="340" cy="185" r="6"/>
    <circle cx="340" cy="285" r="6"/>
  </g>

  <!-- GY-521 pins (real header order) -->
  <g fill="#ffffff" font-size="14">
    <text x="534" y="115">VCC</text>
    <text x="534" y="140">GND</text>
    <text x="534" y="165">SCL</text>
    <text x="534" y="190">SDA</text>
    <text x="534" y="215" fill="#8ea6d6">XDA</text>
    <text x="534" y="240" fill="#8ea6d6">XCL</text>
    <text x="534" y="265" fill="#8ea6d6">AD0</text>
    <text x="534" y="290">INT</text>
  </g>
  <g fill="#ffd43b">
    <circle cx="520" cy="110" r="6"/><circle cx="520" cy="135" r="6"/>
    <circle cx="520" cy="160" r="6"/><circle cx="520" cy="185" r="6"/>
    <circle cx="520" cy="285" r="6"/>
  </g>
  <g fill="none" stroke="#8ea6d6" stroke-width="2">
    <circle cx="520" cy="210" r="5"/><circle cx="520" cy="235" r="5"/><circle cx="520" cy="260" r="5"/>
  </g>
  <g fill="#8ea6d6" font-size="12" text-anchor="end">
    <text x="508" y="214">not connected</text>
    <text x="508" y="239">not connected</text>
    <text x="508" y="264">n/c → I2C addr 0x68</text>
  </g>

  <!-- Wire labels -->
  <g font-size="12" text-anchor="middle">
    <text x="430" y="102" fill="#ff8787">power</text>
    <text x="430" y="152" fill="#ffe066">clock</text>
    <text x="430" y="202" fill="#69db7c">data</text>
    <text x="430" y="277" fill="#ced4da">optional</text>
  </g>

  <!-- Legend -->
  <text x="40" y="395" fill="#adb5bd" font-size="13">Logical diagram: Uno pins are grouped for clarity. A4/A5 are on the analog header; the SDA/SCL pins beside AREF are the same signals.</text>
  <text x="40" y="415" fill="#adb5bd" font-size="13">VCC may use 5V: the GY-521 has an onboard 3.3 V regulator. Keep I2C wires short (&lt; 30 cm).</text>
</svg>
